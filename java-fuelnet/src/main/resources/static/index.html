<!doctype html><html><head><meta charset="utf-8"><title>FuelNet</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;background:#f6f8fa}section{background:#fff;padding:20px;margin:16px 0;border-radius:8px}input{margin:4px;padding:7px;width:145px}button{padding:8px 12px;background:#0369a1;color:white;border:0;border-radius:4px}pre{white-space:pre-wrap}</style></head><body>
<h1>FuelNet – Java Edition</h1><section><h2>Register / Login</h2><input id="user" placeholder="username"><input id="pass" type="password" placeholder="password"><button onclick="register()">Register</button><button onclick="login()">Login</button><p id="auth"></p></section>
<section><h2>Fuel prediction</h2><form id="f"><input name="vehicleSpeed" value="70" placeholder="Speed km/h"><input name="engineRpm" value="2500" placeholder="RPM"><input name="throttlePosition" value="45" placeholder="Throttle %"><input name="engineLoad" value="55" placeholder="Engine load %"><input name="maf" value="25" placeholder="MAF"><input name="intakeAirTemp" value="35" placeholder="Intake temp"><input name="acceleration" value="1" placeholder="Acceleration"><input name="gearPosition" value="4" placeholder="Gear"><button>Predict</button></form><pre id="out"></pre></section>
<section><h2>Admin: train Random Forest</h2><input id="adminUser" placeholder="admin username"><input id="adminPass" type="password" placeholder="admin password"><button onclick="adminLogin()">Admin login</button><input id="csv" type="file" accept=".csv"><button onclick="train()">Upload & train</button><pre id="trainOut"></pre></section>
<section><h2>Prediction chart</h2><canvas id="chart" width="700" height="240"></canvas></section>
<script>async function call(url,data){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.json()}async function register(){auth.textContent=JSON.stringify(await call('/api/register',{username:user.value,password:pass.value}))}async function login(){auth.textContent=JSON.stringify(await call('/api/login',{username:user.value,password:pass.value}))}async function adminLogin(){trainOut.textContent=JSON.stringify(await call('/api/admin/login',{username:adminUser.value,password:adminPass.value}))}async function train(){let d=new FormData();d.append('dataset',csv.files[0]);let r=await fetch('/api/admin/train',{method:'POST',body:d});trainOut.textContent=await r.text()}function draw(o){let c=chart,g=c.getContext('2d');g.clearRect(0,0,700,240);let a=Object.entries(o.profileScores),m=Math.max(...a.map(x=>x[1]));a.forEach(([n,v],i)=>{g.fillStyle='#0369a1';g.fillRect(150,i*40+15,v/m*450,25);g.fillStyle='#111';g.fillText(n+' '+v+'%',10,i*40+32)});g.fillText('Fuel: '+o.fuelConsumption+' LPH — '+o.drivingProfile,10,225)}f.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));for(let k in x)x[k]=k==='gearPosition'?+x[k]:parseFloat(x[k]);let o=await call('/api/predict',x);out.textContent=JSON.stringify(o,null,2);draw(o)}</script></body></html>
