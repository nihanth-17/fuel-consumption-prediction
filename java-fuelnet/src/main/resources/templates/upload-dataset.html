<!doctype html><html><body><h1>Upload dataset</h1><form id="upload"><input name="dataset" type="file" accept=".csv" required><button>Upload and train</button></form><pre></pre><script>upload.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/train',{method:'POST',body:new FormData(upload)});document.querySelector('pre').textContent=await r.text()}</script></body></html>
