<!doctype html><html><body><h1>Admin login</h1><form id="login"><input name="username" required><input name="password" type="password" required><button>Login</button></form><script>login.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(login)))});if(r.ok)location='/admin-dashboard';else alert(await r.text())}</script></body></html>
