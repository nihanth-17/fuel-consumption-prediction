<!doctype html><html><body><h1>Create account</h1><form id="register"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Register</button></form><pre></pre><script>register.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(register));let r=await fetch('/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)});document.querySelector('pre').textContent=await r.text()}</script></body></html>
